<style>
  :root {
    --bg: #f5f4f0;
    --panel: #ffffff;
    --border: #e3e1db;
    --text: #2a2825;
    --text-dim: #8a8579;
    --accent: #d97757;
    --accent-dim: #f0d9cf;
    --danger: #c0553f;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: 300px;
    min-width: 220px;
    max-width: 420px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 17px;
    margin: 0 0 12px;
    font-weight: 600;
  }
  #search {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #new-note-btn {
    margin-top: 10px;
    width: 100%;
    padding: 9px 10px;
    border: none;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #new-note-btn:hover { opacity: 0.92; }

  #note-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  .note-item {
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .note-item:hover { background: var(--bg); }
  .note-item.active {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  .note-item .title {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .note-item .preview {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-item .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  #empty-list {
    padding: 24px 14px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
  }

  /* Editor */
  #editor-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
  }
  #save-status {
    font-size: 12px;
    color: var(--text-dim);
  }
  #delete-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--danger);
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    cursor: pointer;
  }
  #delete-btn:hover { background: #fbeae5; border-color: var(--danger); }

  #editor-body {
    flex: 1;
    padding: 8px 32px 32px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #note-title {
    border: none;
    outline: none;
    background: transparent;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    padding: 12px 0 4px;
    font-family: inherit;
  }
  #note-title::placeholder { color: var(--text-dim); }
  #note-body {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    font-family: inherit;
    padding-top: 6px;
  }
  #note-body::placeholder { color: var(--text-dim); }

  #placeholder-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    flex-direction: column;
    gap: 10px;
  }
  #placeholder-state button {
    padding: 8px 16px;
    border-radius: 7px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Notes</h1>
      <input id="search" type="text" placeholder="Search notes...">
      <button id="new-note-btn">+ New note</button>
    </div>
    <div id="note-list"></div>
  </div>
  <div id="editor-pane">
    <div id="placeholder-state">
      <div>Select a note, or create a new one.</div>
      <button id="placeholder-new-btn">+ New note</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'notes-app-data-v1';
  let notes = [];
  let activeId = null;
  let searchQuery = '';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      notes = raw ? JSON.parse(raw) : [];
    } catch (e) {
      notes = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch (e) {
      // storage unavailable; fail silently
    }
  }

  function uid() {
    return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) {
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function firstLine(text) {
    const t = (text || '').trim();
    const idx = t.indexOf('\n');
    return idx === -1 ? t : t.slice(0, idx);
  }

  function bodyPreview(text, titleLine) {
    const t = (text || '').trim();
    const rest = t.slice(titleLine.length).trim();
    return rest || 'No additional text';
  }

  function sortedNotes() {
    return [...notes].sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function filteredNotes() {
    const q = searchQuery.trim().toLowerCase();
    const list = sortedNotes();
    if (!q) return list;
    return list.filter(n =>
      (n.title || '').toLowerCase().includes(q) ||
      (n.body || '').toLowerCase().includes(q)
    );
  }

  const listEl = document.getElementById('note-list');
  const editorPane = document.getElementById('editor-pane');
  const searchEl = document.getElementById('search');

  function renderList() {
    const list = filteredNotes();
    listEl.innerHTML = '';
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.id = 'empty-list';
      empty.textContent = searchQuery ? 'No notes match your search.' : 'No notes yet.';
      listEl.appendChild(empty);
      return;
    }
    list.forEach(note => {
      const item = document.createElement('div');
      item.className = 'note-item' + (note.id === activeId ? ' active' : '');
      const title = note.title || 'Untitled note';
      const preview = bodyPreview(note.body, note.title ? '' : firstLine(note.body));
      item.innerHTML =
        '<div class="title">' + escapeHtml(title) + '</div>' +
        '<div class="preview">' + escapeHtml(preview) + '</div>' +
        '<div class="meta">' + formatDate(note.updatedAt) + '</div>';
      item.addEventListener('click', () => selectNote(note.id));
      listEl.appendChild(item);
    });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  let saveTimer = null;
  function renderEditor() {
    const note = notes.find(n => n.id === activeId);
    if (!note) {
      editorPane.innerHTML =
        '<div id="placeholder-state">' +
        '<div>Select a note, or create a new one.</div>' +
        '<button id="placeholder-new-btn">+ New note</button>' +
        '</div>';
      document.getElementById('placeholder-new-btn').addEventListener('click', createNote);
      return;
    }
    editorPane.innerHTML =
      '<div id="editor-toolbar">' +
      '<span id="save-status">Saved ' + formatDate(note.updatedAt) + '</span>' +
      '<button id="delete-btn">Delete</button>' +
      '</div>' +
      '<div id="editor-body">' +
      '<input id="note-title" type="text" placeholder="Title" value="">' +
      '<textarea id="note-body" placeholder="Start writing..."></textarea>' +
      '</div>';

    const titleEl = document.getElementById('note-title');
    const bodyEl = document.getElementById('note-body');
    titleEl.value = note.title || '';
    bodyEl.value = note.body || '';

    function persistChanges() {
      note.title = titleEl.value;
      note.body = bodyEl.value;
      note.updatedAt = Date.now();
      save();
      renderList();
      const status = document.getElementById('save-status');
      if (status) status.textContent = 'Saved ' + formatDate(note.updatedAt);
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(persistChanges, 300);
    }

    titleEl.addEventListener('input', scheduleSave);
    bodyEl.addEventListener('input', scheduleSave);

    document.getElementById('delete-btn').addEventListener('click', () => deleteNote(note.id));
  }

  function selectNote(id) {
    activeId = id;
    renderList();
    renderEditor();
  }

  function createNote() {
    const note = {
      id: uid(),
      title: '',
      body: '',
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    notes.push(note);
    save();
    activeId = note.id;
    renderList();
    renderEditor();
    setTimeout(() => {
      const t = document.getElementById('note-title');
      if (t) t.focus();
    }, 0);
  }

  function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);
    save();
    if (activeId === id) activeId = null;
    renderList();
    renderEditor();
  }

      ocument.getElementById('new-note-btn').addEventListener('click', createNote);
  searchEl.addEventListener('input', () => {
    searchQuery = searchEl.value;
    renderList();
  });

  load();
  renderList();
  renderEditor();
})();
</script>
